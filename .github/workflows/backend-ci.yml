name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pudim
          POSTGRES_PASSWORD: pudim
          POSTGRES_DB: pudimfinance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: pudim
          RABBITMQ_DEFAULT_PASS: pudim
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      # Check latest: https://github.com/actions/checkout/releases
      - uses: actions/checkout@v6

      # Check latest: https://github.com/actions-rust-lang/setup-rust-toolchain/releases
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        # Check latest: https://github.com/Swatinem/rust-cache/releases
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Generate OpenAPI spec
        run: cargo run --bin gen-openapi > /tmp/openapi-generated.json

      - name: Compare OpenAPI spec with committed version
        run: diff ../api/openapi/openapi.json /tmp/openapi-generated.json

      - name: Build
        run: cargo build --release
        env:
          DATABASE_URL: postgres://pudim:pudim@localhost:5432/pudimfinance
          RABBITMQ_URL: amqp://pudim:pudim@localhost:5672

      - name: Run tests
        run: cargo test --release
        env:
          DATABASE_URL: postgres://pudim:pudim@localhost:5432/pudimfinance
          RABBITMQ_URL: amqp://pudim:pudim@localhost:5672
          RUST_LOG: backend=debug

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      # Check latest: https://github.com/actions/checkout/releases
      - uses: actions/checkout@v6

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit