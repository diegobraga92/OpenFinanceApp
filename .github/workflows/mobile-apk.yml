name: Mobile APK Build

# Builds an installable Android release APK (debug-signed) from the managed
# Expo project and uploads it as a workflow artifact so you can download and
# sideload it on a phone. Triggered on mobile changes to main, or manually
# from the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      # Check latest: https://github.com/actions/checkout/releases
      - uses: actions/checkout@v7

      # Check latest: https://github.com/actions/setup-node/releases
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      # React Native 0.74 / Expo 51 requires Java 17 for Gradle.
      # Check latest: https://github.com/actions/setup-java/releases
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Check latest: https://github.com/android-actions/setup-android
      - uses: android-actions/setup-android@v4

      # Gradle dependency cache (speeds up repeat builds).
      # Check latest: https://github.com/gradle/actions
      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Sign the release APK with the private release keystore (from GitHub
      # secrets) instead of the public debug keystore. Google Play Protect
      # blocks sideloaded APKs signed with the debug/test key, so release
      # builds must use a real keystore. When the secrets are not configured
      # the build falls back to the debug keystore (with a warning).
      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            printf '\n# Private release signing (injected by CI - never hard-code).\nPUDIM_RELEASE_STORE_FILE=release.keystore\nPUDIM_RELEASE_STORE_PASSWORD=%s\nPUDIM_RELEASE_KEY_ALIAS=%s\nPUDIM_RELEASE_KEY_PASSWORD=%s\n' "$RELEASE_KEYSTORE_PASSWORD" "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD" >> android/gradle.properties
            echo "Release signing configured with keystore."
          else
            echo "::warning::No RELEASE_KEYSTORE_BASE64 secret set — release APK will be debug-signed (Play Protect may block it)."
          fi

      # Build a RELEASE APK: debug builds deliberately skip JS bundling (they
      # expect Metro to be running) and crash on launch with "Unable to load
      # script ... index.android.bundle". Release builds embed the Hermes JS
      # bundle via Expo's `export:embed` step and are signed with the private
      # release keystore when the secrets above are configured (otherwise they
      # fall back to the debug keystore so the workflow still works).
      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        # Check latest: https://github.com/actions/upload-artifact/releases
        uses: actions/upload-artifact@v5
        with:
          name: pudimfinance-release
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
