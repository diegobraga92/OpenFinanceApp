services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pudim
      POSTGRES_PASSWORD: pudim
      POSTGRES_DB: pudimfinance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pudim -d pudimfinance"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://pudim:pudim@postgres:5432/pudimfinance
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
      RUST_LOG: backend=debug,tower_http=debug
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    depends_on:
      - backend

volumes:
  pgdata:
