openapi: "3.1.0"
info:
  title: PudimFinance Health API
  version: "0.1.0"
  description: |
    Health check endpoint for the PudimFinance backend.
    Used by the web frontend, mobile app, and load balancers to
    verify service availability.

servers:
  - url: http://localhost:3000
    description: Local development

paths:
  /health:
    get:
      operationId: getHealth
      summary: Check service health
      description: |
        Returns the health status of the backend and its dependencies
        (PostgreSQL, RabbitMQ). Returns 200 if healthy, 503 if degraded.
      tags:
        - Health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service is degraded or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthError"

  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics endpoint
      description: |
        Exposes Prometheus-formatted metrics for scraping.
        Includes HTTP request duration, connection pool stats, and
        business-level metrics.
      tags:
        - Observability
      responses:
        "200":
          description: Prometheus metrics in text format
          content:
            text/plain:
              schema:
                type: string

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - database
        - rabbitmq
        - version
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: Overall service status
        database:
          type: string
          enum: [connected, disconnected, degraded]
          description: PostgreSQL connection status
        rabbitmq:
          type: string
          enum: [connected, disconnected, degraded, disabled]
          description: RabbitMQ connection status
        version:
          type: string
          description: Backend version (semver)
          example: "0.1.0"

    HealthError:
      type: object
      required:
        - status
        - database
        - rabbitmq
        - details
      properties:
        status:
          type: string
          enum: [unhealthy]
        database:
          type: string
          enum: [connected, disconnected, degraded]
        rabbitmq:
          type: string
          enum: [connected, disconnected, degraded, disabled, unknown]
        details:
          type: string
          description: Human-readable error details