[package]
name = "pudimfinance-desktop"
version = "0.1.0"
description = "PudimFinance — personal finance desktop client"
authors = ["PudimFinance"]
edition = "2021"
rust-version = "1.77.2"

# The library is what the mobile entry point and the CLI binary share; the
# crate-type list is the standard Tauri 2 setup.
[lib]
name = "pudimfinance_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Android notification capture (bank transaction alerts). Registers the native
# NotificationListenerService + Keystore-backed secure storage on Android;
# degrades to no-ops on desktop so the shared UI renders the "Android only"
# messaging.
pudim-android-native = { path = "./plugins/pudim-android-native" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = "3"

# Phase 1 keeps the surface minimal. Later phases add:
#   - tauri-plugin-sql  (offline SQLite mirror)
#   - zbus (D-Bus notification monitor for bank capture)
#   - tauri-plugin-dialog (file pickers for reconciliation/receipts)
#   - tauri-plugin-global-shortcut + tray (quick add)
